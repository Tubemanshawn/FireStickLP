# XcodeGen project file: GitHub's Mac turns this into FireTvLp.xcodeproj
# (so no Xcode project needs to be kept in the repo).
name: FireTvLp
options:
  bundleIdPrefix: com.tubemanshawn
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  FireTvLp:
    type: application
    platform: iOS
    sources:
      - FireTvLp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tubemanshawn.firetvlp
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: FireTvLp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: FireTvLp connects to your Fire TV Stick on your Wi-Fi to work as its remote, show its RAM and debloat it.
