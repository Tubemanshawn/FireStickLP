<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: mediastream:">

<title>Retro TV</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; gap: 14px; padding: 14px;
    background: #0b0b0b; color: #eee; font: 15px/1.4 system-ui, sans-serif;
  }
  #left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  #right { width: 250px; flex: none; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: none; }
  .tab { padding: 7px 0; background: #222; color: #aaa; }
  .tab.on { background: #2e7d32; color: #fff; }
  .pane { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px;
    overflow-y: auto; padding-right: 4px; }
  .pane[hidden] { display: none; }

  /* ---- system tab ---- */
  .meter { height: 14px; background: #222; border-radius: 7px; overflow: hidden; border: 1px solid #333; }
  #ramBar { height: 100%; width: 0; background: #2e7d32; transition: width .4s, background .4s; }
  #ramBar.warn { background: #f9a825; }
  #ramBar.high { background: #c62828; }
  .stat { font-size: 13px; color: #ccc; }
  .mine-key { color: #81c784; }
  .app { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px;
    background: #161616; font-size: 12px; }
  .app .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app .mem { color: #9e9e9e; font-variant-numeric: tabular-nums; }
  .app.mine .name { color: #81c784; }
  .app.front { outline: 1px solid #1565c0; }
  .app button { padding: 3px 7px; font-size: 11px; background: #5d1f1f; }
  #appList { display: flex; flex-direction: column; gap: 4px; }

  /* ---- TV ---- */
  .screen {
    position: relative; flex: 1; min-height: 0; background: #000;
    border-radius: 10px; overflow: hidden; border: 3px solid #222;
  }
  video { width: 100%; height: 100%; object-fit: contain; background: #000;
    filter: var(--bw,) var(--warm,); }
  .scan, .vig { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .scan { background: repeating-linear-gradient(to bottom, rgba(0,0,0,.35) 0 1px, transparent 1px 3px); }
  .vig  { background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.75) 100%); }
  body.fx-scan .scan { opacity: 1; }
  body.fx-curve .vig { opacity: 1; }
  body.fx-bw   video { --bw: grayscale(1) contrast(1.15); }
  body.fx-warm video { --warm: sepia(.3) saturate(1.3); }

  #osd {
    position: absolute; left: 4%; top: 5%; font: bold 22px Consolas, monospace;
    color: #3f3; text-shadow: 0 0 6px #3f3, 2px 2px 0 #000;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  #osd.show { opacity: 1; }
  #remoteBadge {
    position: absolute; right: 4%; top: 5%; font: bold 15px system-ui;
    background: #c62828; color: #fff; padding: 4px 10px; border-radius: 6px;
    display: none;
  }
  body.remote #remoteBadge { display: block; }

  /* ---- buttons / controls ---- */
  button { font: inherit; padding: 8px 10px; border: 0; border-radius: 8px;
    background: #333; color: #fff; cursor: pointer; }
  button:hover { filter: brightness(1.2); }
  button:active { transform: translateY(1px); }
  button.on { background: #2e7d32; }
  select { font: inherit; padding: 6px; border-radius: 8px; background: #222; color: #fff; border: 1px solid #444; width: 100%; }
  label { font-size: 13px; color: #bbb; }
  .row { display: flex; gap: 8px; align-items: center; }
  h3 { margin: 6px 0 0; font-size: 14px; color: #9ccc65; }
  #msg { font-size: 12px; color: #ffb74d; min-height: 1em; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #c22; display: inline-block; }
  .dot.up { background: #2c2; box-shadow: 0 0 8px #3f3; }

  /* ---- remote pad ---- */
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .pad button { padding: 14px 0; font-size: 16px; }
  .pad .ok { background: #1565c0; font-weight: bold; }
  .wide { grid-column: 1 / -1; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
</style>
</head>
<body class="fx-scan fx-curve">

<div id="left">
  <div class="screen" id="screenBox">
    <video id="video" playsinline muted></video>
    <div class="scan"></div>
    <div class="vig"></div>
    <div id="osd">CLICK TO START</div>
    <div id="remoteBadge">● REMOTE MODE</div>
  </div>
  <div class="row">
    <button id="pipBtn">⧉ Pop out</button>
    <button id="listenBtn">🔇 Listen: OFF</button>
    <button id="remoteBtn">🎮 Remote Mode</button>
    <span style="margin-left:auto"><span class="dot" id="statusDot"></span> Fire Stick</span>
  </div>
  <div id="msg"></div>
</div>

<div id="right">
  <div class="tabs">
    <button class="tab on" data-tab="controls">🎮 Controls</button>
    <button class="tab" data-tab="system">📊 System</button>
  </div>
  <div class="pane" id="pane-controls">
  <h3>Remote</h3>
  <div class="pad">
    <button></button>
    <button data-k="up">▲</button>
    <button></button>
    <button data-k="left">◀</button>
    <button class="ok" data-k="ok">OK</button>
    <button data-k="right">▶</button>
    <button></button>
    <button data-k="down">▼</button>
    <button></button>
  </div>
  <div class="two">
    <button data-k="back">↩ Back</button>
    <button data-k="home">⌂ Home</button>
    <button data-k="menu">☰ Menu</button>
    <button data-k="apps">▦ Apps</button>
    <button data-k="rewind">⏪</button>
    <button data-k="forward">⏩</button>
    <button data-k="playpause" class="wide">⏯ Play / Pause</button>
    <button data-k="voldown">🔉 Vol −</button>
    <button data-k="volup">🔊 Vol +</button>
    <button data-k="sleep">⏻ Sleep</button>
    <button data-k="wake">☀ Wake</button>
    <button id="settingsBtn" class="wide">⚙ Fire TV Settings</button>
  </div>

  <h3>Search (type on Fire TV)</h3>
  <div class="row">
    <input id="typeBox" style="flex:1; padding:6px; border-radius:8px; background:#222; color:#fff; border:1px solid #444;" placeholder="type then Enter">
  </div>

  <h3>Fire Stick address</h3>
  <div class="row">
    <input id="ipBox" style="flex:1; min-width:0; padding:6px; border-radius:8px; background:#222; color:#fff; border:1px solid #444;" placeholder="e.g. 192.168.1.50" spellcheck="false">
  </div>
  <div class="two">
    <button id="ipConnect">Connect</button>
    <button id="ipDisconnect">Disconnect</button>
  </div>
  <label style="color:#888">Find it on the Fire Stick: Settings → My Fire TV → About → Network.</label>

  <h3>Debloat</h3>
  <div class="two">
    <button id="debloatAuto">Auto: ON</button>
    <button id="debloatNow">Debloat now</button>
  </div>
  <label id="debloatInfo" style="color:#888">Turns Amazon's extra apps back off each time the app connects (they come back after every Fire Stick reboot).</label>

  <h3>Devices</h3>
  <label>Video <select id="cam"></select></label>
  <label>TV sound <select id="aud"></select></label>
  <label>Play to <select id="out"></select></label>

  <h3>Look</h3>
  <div class="two">
    <button data-fx="scan">Scanlines</button>
    <button data-fx="curve">CRT</button>
    <button data-fx="bw">B&amp;W</button>
    <button data-fx="warm">Warm</button>
  </div>
  <label style="color:#888">Hotkey Ctrl+Alt+R toggles Remote Mode anywhere.</label>
  </div>

  <div class="pane" id="pane-system" hidden>
    <h3>Memory (RAM)</h3>
    <div class="meter"><div id="ramBar"></div></div>
    <div id="ramText" class="stat">Open this tab with the Fire Stick connected…</div>
    <div id="swapText" class="stat"></div>
    <div id="uptimeText" class="stat"></div>
    <button id="freeRamBtn">🧹 Free RAM</button>
    <div id="freeRamText" class="stat"></div>

    <h3>Home screen</h3>
    <button id="launcherBtn">Lighter home screen: OFF</button>
    <label id="launcherText" style="color:#888">Swaps Amazon's home screen (~190 MB) for a lighter launcher. Install <b>Projectivy Launcher</b> from the Fire Stick Appstore first.</label>
    <div id="sweepText" class="stat"></div>

    <h3>Running apps <span id="appCount" style="color:#888; font-weight:normal"></span></h3>
    <label style="color:#888">Sorted by memory. ▶ = on screen now. <span class="mine-key">Green</span> = apps you installed (can be stopped).</label>
    <div id="appList"></div>
    <div id="sysMsg" class="stat" style="color:#ffb74d"></div>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
